<style>
:root{--bg:#0b1a4a;--card:#13296e;--gold:#f5b301;--txt:#fff;--mut:#9fb0e0;--red:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--gold)}
header h1{flex:1;margin:0;font-size:19px;text-align:center}
.logo{font-weight:900;font-size:22px;color:var(--gold);letter-spacing:1px}
.back{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:6px 12px;font-size:15px}
main{padding:14px;max-width:640px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:20px 8px;text-align:center;color:var(--txt);font-size:17px;font-weight:700;min-height:110px}
.tile.main{grid-column:span 2;background:linear-gradient(135deg,#f5b301,#ffd24d);color:#0b1a4a}
.tile small{display:block;font-weight:400;color:var(--mut);margin-top:4px}.tile.main small{color:#3a3a3a}
.tile.off{opacity:.55}.ic{font-size:30px;display:block}
.bar{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;background:var(--gold);color:#0b1a4a;border:0;border-radius:12px;padding:12px 6px;font-weight:800;font-size:15px}
.btn.alt{background:var(--card);color:var(--gold);border:1px solid var(--gold)}
input,textarea{width:100%;background:#0e2160;color:var(--txt);border:1px solid #2c46a0;border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:3px}
.row{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;padding:10px 4px;border-bottom:1px solid #22388a;align-items:center}
.row b{font-weight:600}.row span{text-align:center;font-size:14px;color:var(--gold)}.row .z{color:var(--red)}
.hd{color:var(--mut);font-size:12px}
.cnt{color:var(--mut);font-size:13px;margin:8px 2px}
#m{position:fixed;inset:0 0 auto 0;top:env(safe-area-inset-top,0px);z-index:9}
.modal{background:var(--card);border:2px solid var(--gold);border-radius:0 0 18px 18px;padding:14px;max-height:50vh;overflow:auto}
.modal h3{margin:0 0 10px;color:var(--gold)}
.ln{display:flex;gap:6px;align-items:center;padding:8px 2px;border-bottom:1px solid #22388a;flex-wrap:wrap}.ln b{flex:1 0 100%;font-weight:600}.ln input{flex:1;min-width:0;margin:0;padding:8px}.ln button{background:none;border:0;color:var(--red);font-size:22px}
.sg{background:#0e2160;border-radius:8px;margin-bottom:4px;padding:10px}.tt{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px;margin:10px 0;display:flex;justify-content:space-between;font-weight:800}
#t{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#0b1a4a;font-weight:700;padding:10px 18px;border-radius:20px;z-index:10;display:none}
html,body{font-size:18px}input,textarea{font-size:18px}.btn{font-size:17px;padding:14px 6px}.cnt{font-size:15px}.hd{font-size:13px}.back{font-size:16px}
body{background:radial-gradient(120% 60% at 50% 0,#1a357f 0,#0b1a4a 60%) fixed}
.hero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;border:2px solid var(--gold);background:linear-gradient(160deg,#1f3fa0,#0c1d57 65%);box-shadow:0 8px 0 #060e2c,0 16px 28px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.22);margin:4px 0 18px}
.lg{width:92px;height:92px;border-radius:22px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.65));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(-2deg)}}@media(prefers-reduced-motion:reduce){.lg{animation:none}}
.hi{flex:1;min-width:0}.sh{font-size:23px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #0009;line-height:1.25}.dt{color:var(--mut);font-size:15px;margin-top:6px}
.ex{background:linear-gradient(180deg,#ff8a8a,#d63a3a);border:0;color:#fff;border-radius:14px;padding:8px 12px;font-size:22px;box-shadow:0 4px 0 #7a1717;line-height:1.1}.ex small{display:block;font-size:12px}.ex:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1717}
.tile{background:linear-gradient(180deg,#244bb5,#102467);border:2px solid var(--gold);border-radius:20px;font-size:20px;box-shadow:0 6px 0 #060e2c,0 12px 20px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.2);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 #060e2c,0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2)}
.tile.main{width:100%;min-height:140px;font-size:26px;margin-bottom:18px;background:linear-gradient(180deg,#ffe07a,#f5b301 55%,#d99600);border-color:#fff3b0;color:#0b1a4a;box-shadow:0 7px 0 #8a5f00,0 14px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6)}
.tile.main:active{box-shadow:0 1px 0 #8a5f00,0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}.tile .ic{font-size:36px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}.grid2 .tile{min-height:120px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:6px 14px 10px;box-shadow:0 6px 0 #060e2c,0 12px 20px rgba(0,0,0,.4)}
.ch{display:flex;justify-content:space-between;gap:8px;padding:12px 0;color:var(--gold);font-weight:800}
.tr{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid #2a43a0}.tr i{flex:0 0 30px;height:30px;border-radius:50%;background:var(--gold);color:#0b1a4a;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.tr b{flex:1;font-weight:600;min-width:0}.tr span{color:var(--gold);font-weight:800}
.bye{text-align:center;padding-top:14vh}.bye .lg{animation:none;width:130px;height:130px}
.bad{border-color:var(--red)!important;background:#3a1020!important}
.two{display:flex;gap:8px}.two input{flex:1;min-width:0}
.hm{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 8px)}
.card{flex:1;display:flex;flex-direction:column}.tr{flex:1;min-height:60px;max-height:88px}.tr b{font-size:19px}
.ex{background:linear-gradient(180deg,#ffe07a,#f5b301);color:#0b1a4a;box-shadow:0 4px 0 #8a5f00}.ex:active{box-shadow:0 1px 0 #8a5f00}
.grid2 .tile.main{width:auto;min-height:120px;font-size:20px;margin:0}
.grid2 .tile.main{grid-column:auto}.tile.main small{color:#5a4300}
.card{flex:none}.tr{flex:none;min-height:0;max-height:none;padding:12px 2px}.tr b{flex:1;min-width:0}.tr span{white-space:nowrap}
.ch{background:linear-gradient(180deg,#2d54c0,#1c3b9a);border-radius:14px;padding:14px;margin:8px 0 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 0 #0a1642;align-items:center}.ld{flex:1;border-bottom:2px dotted #7f96e0;height:0;margin:0 6px;align-self:center}
.wb{flex:0 0 46px;height:46px;border:0;border-radius:14px;background:linear-gradient(#45e583,#1fae55);font-size:22px;box-shadow:0 3px 0 #0e6a32;padding:0}.wb:active{transform:translateY(2px);box-shadow:0 1px 0 #0e6a32}
.ln{flex-wrap:nowrap}.ln b{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}.ln input{flex:0 0 88px;padding:10px 6px;text-align:center}.ln input.q{flex:0 0 62px}.ln button{flex:0 0 34px;padding:0}
.need{border-color:#ff9f1c!important;background:#3b2a08!important;box-shadow:0 0 0 2px rgba(255,159,28,.35)}
.btn.wa{background:linear-gradient(#45e583,#1fae55);color:#052b13;box-shadow:0 4px 0 #0e6a32}.btn.new{background:linear-gradient(#8aeaff,#27b4d8);color:#04243a;box-shadow:0 4px 0 #0f6f8a}.btn.full{background:linear-gradient(#5fe0d2,#1ea99c);color:#032b27;box-shadow:0 4px 0 #0c6a62}
.nw{color:#8aeaff;font-weight:700;border:1px dashed #27b4d8;border-radius:8px;margin-bottom:4px;padding:12px;background:#0e2160}

<script>
// ===== قاعدة البيانات + المحرك الذري =====
const rq=r=>new Promise((o,n)=>{r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)});
let db;
const openDB=()=>new Promise((o,n)=>{const r=indexedDB.open('foad',1);
 r.onupgradeneeded=()=>{const d=r.result;
  d.createObjectStore('products',{keyPath:'id',autoIncrement:true}).createIndex('k','k',{unique:true});
  d.createObjectStore('customers',{keyPath:'phone'});
  d.createObjectStore('bons',{keyPath:'id'}).createIndex('phone','phone');
  d.createObjectStore('ops',{keyPath:'id',autoIncrement:true});
  d.createObjectStore('meta',{keyPath:'k'});};
 r.onsuccess=()=>{db=r.result;o()};r.onerror=()=>n(r.error)});
// معاملة واحدة: إما كل شيء أو لا شيء
const tx=(st,fn)=>new Promise((ok,no)=>{const t=db.transaction(st,'readwrite');let v;
 t.oncomplete=()=>ok(v);t.onabort=()=>no(t.error||new Error('تم الإلغاء'));
 fn(t).then(x=>v=x).catch(e=>{no(e);try{t.abort()}catch(_){}})});
const C=x=>{const n=parseFloat(String(x).replace(',','.').replace(/[^\d.\-]/g,''));return isFinite(n)?Math.round(n*100):0}; // سنتيم صحيح
const M=c=>(c/100).toLocaleString('fr-FR',{maximumFractionDigits:2}).replace(/[\u202f\u00a0]/g,' ');
const ph=s=>{s=String(s).replace(/\D/g,'').replace(/^00/,'').replace(/^212/,'').replace(/^0/,'');return s.length>=8?s:''};
const E={
 async sale(o){const phone=ph(o.phone),name=(o.name||'').trim();
  if(!name||!phone)throw new Error('الاسم والهاتف إجباريان');
  const L=(o.lines||[]).map(l=>({n:l.n,q:parseFloat(l.q),p:C(l.p)})).filter(l=>l.n&&l.q>0);
  if(!L.length)throw new Error('الفاتورة فارغة');
  L.forEach(l=>l.t=Math.round(l.p*l.q));
  const total=L.reduce((s,l)=>s+l.t,0),paid=Math.max(0,Math.min(C(o.paid),total));
  return tx(['customers','bons','ops','meta','products'],async t=>{
   const d=new Date(),day=String(d.getFullYear()%10)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
   const ms=t.objectStore('meta'),s=await rq(ms.get('seq'+day)),n=(s?s.v:0)+1;
   await rq(ms.put({k:'seq'+day,v:n}));
   const b={id:day+String(n).padStart(3,'0'),ts:Date.now(),phone,lines:L,total,paid,rest:total-paid};
   await rq(t.objectStore('customers').put({phone,name}));
   const ps=t.objectStore('products');
   for(const l of L){const nm=String(l.n).trim().replace(/\s+/g,' '),k=nm.toLowerCase();if(!await rq(ps.index('k').get(k)))await rq(ps.add({n:nm,k,s:l.p,b:0}))}
   await rq(t.objectStore('bons').put(b));
   await rq(t.objectStore('ops').put({ts:b.ts,type:'sale',phone,bon:b.id,amt:total}));
   return b})},
 // توزيع المبلغ من الأقدم إلى الأحدث
 async oldDebt(o){const phone=ph(o.phone),name=(o.name||'').trim(),amt=C(o.amount);
  if(!name||!phone)throw new Error('الاسم والهاتف إجباريان');if(amt<=0)throw new Error('أدخل مبلغ الدين');
  return tx(['customers','bons','ops','meta'],async t=>{const bs=t.objectStore('bons'),ex=await rq(bs.index('phone').getAll(phone));
   const dt=o.date?new Date(o.date+'T12:00:00').getTime():NaN,ts=isNaN(dt)?(ex.length?Math.min(...ex.map(b=>b.ts))-1:Date.now()):dt;
   const ms=t.objectStore('meta'),s=await rq(ms.get('seqD')),n=(s?s.v:0)+1;await rq(ms.put({k:'seqD',v:n}));
   const b={id:'D'+String(n).padStart(3,'0'),ts,phone,lines:[{n:'دين سابق',q:1,p:amt,t:amt}],total:amt,paid:0,rest:amt,old:true};
   await rq(t.objectStore('customers').put({phone,name}));await rq(bs.put(b));await rq(t.objectStore('ops').put({ts,type:'old',phone,bon:b.id,amt}));return b})},
 async fifo(t,phone,amt){const bs=t.objectStore('bons');
  const a=(await rq(bs.index('phone').getAll(phone))).sort((x,y)=>x.ts-y.ts);
  for(const b of a){if(amt<=0)break;if(b.rest>0){const d=Math.min(b.rest,amt);b.rest-=d;amt-=d;await rq(bs.put(b))}}
  return amt},
 async pay(phone,amt){phone=ph(phone);amt=C(amt);if(!phone||amt<=0)throw new Error('مبلغ غير صالح');
  return tx(['bons','ops'],async t=>{if(await E.fifo(t,phone,amt)>0)throw new Error('المبلغ أكبر من الدين');
   await rq(t.objectStore('ops').put({ts:Date.now(),type:'pay',phone,amt}));return amt})},
 // الإرجاع يخصم من الدين أولاً والباقي يُرد للزبون
 async ret(phone,amt){phone=ph(phone);amt=C(amt);if(!phone||amt<=0)throw new Error('مبلغ غير صالح');
  return tx(['bons','ops'],async t=>{const left=await E.fifo(t,phone,amt);
   await rq(t.objectStore('ops').put({ts:Date.now(),type:'ret',phone,amt,refund:left}));return{debt:amt-left,refund:left}})},
 async debts(){const a=await rq(db.transaction('bons').objectStore('bons').getAll());return a.reduce((s,b)=>s+b.rest,0)}
};
const P={all:()=>rq(db.transaction('products').objectStore('products').getAll()),
 async add(rows){let ok=0,dup=0;
  await tx(['products'],async t=>{const s=t.objectStore('products');
   for(const r of rows){const n=r.n.trim().replace(/\s+/g,' ');if(!n)continue;const k=n.toLowerCase();
    if(await rq(s.index('k').get(k))){dup++;continue}
    await rq(s.add({n,k,s:C(r.s),b:C(r.b)}));ok++}});
  return{ok,dup}}};
const DEF={tpl:'🧰 *{magasin}*\n--------------------------------\nb.l. n° : {n}\nDate : {date}   Heure : {heure}\nClient : {client}\n--------------------------------\n{lignes}\n--------------------------------\nNombre des articles : {articles}\n*Montant total : {total} {cur}*\nPayé : {paye} {cur}\nReste : {reste} {cur}\n--------------------------------\nTéléphone ☎️ : {tel}\nAdresse 📍 : {adr}\n{merci}',lnf:'{i}. {produit} {q}×{p} = {t}',shop:'Foad',tel:'',adr:'',thx:'شكراً لثقتكم، نتمنى رؤيتكم قريباً',cur:'DH',cc:'212',
 rem:'السلام عليكم {client}، نذكّركم بأن المبلغ المتبقي عليكم هو {reste} {cur}. {magasin} {tel}'};
const cfg=async()=>{const r=await rq(db.transaction('meta').objectStore('meta').get('cfg'));return{...DEF,...(r?r.v:{})}};
const setCfg=v=>tx(['meta'],t=>rq(t.objectStore('meta').put({k:'cfg',v})));

// ===== الواجهة =====
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)};
const modal=h=>{$('#m').innerHTML=h?`<div class="modal">${h}</div>`:''};
const head=(t,back)=>`<header>${back?'<button class="back" onclick="home()">رجوع</button>':''}<h1>${t}</h1><span class="logo">Foad</span></header>`;

let H;
async function home(){
 const R=s=>db.transaction(s).objectStore(s);
 const [c,cu,bs,lb,n,np]=await Promise.all([cfg(),rq(R('customers').getAll()),rq(R('bons').getAll()),rq(R('meta').get('lastBackup')),rq(R('ops').count()),rq(R('products').count())]);
 const d={};bs.forEach(b=>d[b.phone]=(d[b.phone]||0)+b.rest);
 const top=cu.map(x=>({...x,d:d[x.phone]||0})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,5),T=Object.values(d).reduce((s,x)=>s+x,0),
 old=n>0&&(!lb||Date.now()-lb.v>3*864e5);H={c,top};
 let dt;try{dt=new Date().toLocaleDateString('ar-MA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(_){dt=new Date().toLocaleDateString('fr-FR')}
 $('#app').innerHTML=`<main class="hm">
 <section class="hero"><img class="lg" src="${LOGO}" alt="Foad"><div class="hi"><div class="sh">${e(c.shop)}</div><div class="dt">${dt}</div></div><button class="ex" onclick="settings()">⚙️<small>الإعدادات</small></button></section>
 ${old?'<button class="btn" style="width:100%;margin-bottom:14px;background:var(--red);color:#fff" onclick="backup()">⚠️ خذ نسخة احتياطية الآن</button>':''}
 <div class="grid2"><button class="tile main" onclick="sale()"><span class="ic">🧾</span>بون التسليم<small>bon de livraison</small></button><button class="tile" onclick="stock()"><span class="ic">📦</span>المنتجات<small>${np} منتج</small></button></div>
 <section class="card"><div class="ch" onclick="customers()"><b>👥 ديون الزبناء</b><span class="ld"></span><span dir="ltr">${M(T)} ${e(c.cur)}</span></div>
 ${top.map((x,i)=>`<div class="tr" onclick="cust('${x.phone}')"><b>${i+1}- ${e(x.name)}</b><span dir="ltr">${M(x.d)} ${e(c.cur)}</span><button class="wb" onclick="event.stopPropagation();rmd(${i})" aria-label="تذكير">💬</button></div>`).join('')||'<div class="cnt" style="text-align:center;padding:24px">لا توجد ديون 🎉</div>'}</section></main>`}
function rmd(i){const x=H.top[i],c=H.c;openWa('https://wa.me/'+c.cc+x.phone+'?text='+encodeURIComponent(fill(c.rem,{client:x.name,reste:M(x.d),cur:c.cur,magasin:c.shop,tel:c.tel})))}

async function stock(q=''){
 const all=(await P.all()).sort((a,b)=>a.n.localeCompare(b.n)),k=q.trim().toLowerCase();
 const L=k?all.filter(x=>x.k.includes(k)):all;
 $('#app').innerHTML=head('المنتجات',1)+`<main><div class="bar">
 <button class="btn" onclick="addP()">＋ إضافة</button><button class="btn alt" onclick="pasteP()">لصق Excel</button><button class="btn alt" onclick="exportP()">تصدير CSV</button></div>
 <input id="q" placeholder="ابحث بالحروف الأولى…" value="${e(q)}" oninput="stock(this.value)">
 <div class="cnt">${L.length} / ${all.length}</div>
 <div class="row hd"><b>المنتج</b><span>البيع</span><span>الشراء</span></div>
 ${L.slice(0,200).map(x=>`<div class="row"><b>${e(x.n)}</b><span class="${x.s?'':'z'}">${M(x.s)}</span><span class="${x.b?'':'z'}">${M(x.b)}</span></div>`).join('')||'<div class="cnt">لا توجد منتجات</div>'}</main>`;
 if(q){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}}
function addP(){modal(`<h3>إضافة منتج</h3><input id="an" placeholder="اسم المنتج"><input id="as" inputmode="decimal" placeholder="سعر البيع"><input id="ab" inputmode="decimal" placeholder="سعر الشراء (للتذكير)"><div class="bar"><button class="btn" onclick="saveP()">حفظ</button><button class="btn alt" onclick="modal('')">إلغاء</button></div>`);$('#an').focus()}
async function saveP(){const r=await P.add([{n:$('#an').value,s:$('#as').value,b:$('#ab').value}]);
 if(r.dup)return toast('هذا المنتج موجود');if(!r.ok)return toast('أدخل اسم المنتج');modal('');toast('تمت الإضافة');stock()}
function pasteP(){modal(`<h3>لصق من Excel</h3><label>ثلاثة أعمدة: المنتج | البيع | الشراء</label><textarea id="pt" rows="5"></textarea><div class="bar"><button class="btn" onclick="doPaste()">استيراد</button><button class="btn alt" onclick="modal('')">إلغاء</button></div>`);$('#pt').focus()}
async function doPaste(){const rows=$('#pt').value.split(/\r?\n/).map(l=>l.split(/\t|;/)).filter(c=>c[0]&&c[0].trim()).map(c=>({n:c[0],s:c[1]||0,b:c[2]||0}));
 if(!rows.length)return toast('لا توجد بيانات');const r=await P.add(rows);modal('');toast(`أضيف ${r.ok} — مكرر ${r.dup}`);stock()}
async function exportP(){const a=await P.all();
 const csv='\ufeffالمنتج;البيع;الشراء\n'+a.map(x=>`"${x.n.replace(/"/g,'""')}";${x.s/100};${x.b/100}`).join('\n');
 const f=new File([csv],'foad-products.csv',{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(_){}
 const l=document.createElement('a');l.href=URL.createObjectURL(f);l.download=f.name;l.click();
 try{await navigator.clipboard.writeText(csv);toast('تم التصدير ونسخ المحتوى')}catch(_){toast('تم التصدير')}}

async function settings(){const c=await cfg();
 const f=(k,l,t)=>`<label>${l}</label>${t?`<textarea id="c_${k}" rows="${t>1?t:3}">${e(c[k])}</textarea>`:`<input id="c_${k}" value="${e(c[k])}">`}`;
 $('#app').innerHTML=head('الإعدادات',1)+`<main>${f('shop','اسم المحل / الموزع (يظهر في الرئيسية)')}${f('tel','هاتف المحل')}${f('adr','العنوان')}${f('thx','عبارة الشكر',1)}${f('cur','العملة')}${f('cc','مفتاح الدولة للواتساب (212)')}${f('rem','رسالة تذكير الدين — {client} {reste} {cur} {magasin} {tel}',1)}${f('tpl','قالب ورقة التسليم — {magasin} {n} {date} {heure} {client} {lignes} {articles} {total} {paye} {reste} {tel} {adr} {merci} {cur}',9)}${f('lnf','شكل سطر المنتج — {i} {produit} {q} {p} {t}')}<div class="bar"><button class="btn alt" onclick="prevBon()">👁 معاينة</button><button class="btn alt" onclick="$('#c_tpl').value=DEF.tpl;$('#c_lnf').value=DEF.lnf">↺ الافتراضي</button></div>
 <button class="btn" onclick="saveCfg()" style="width:100%">حفظ</button>
 <div class="bar" style="margin-top:14px"><button class="btn alt" onclick="backup()">📤 نسخة احتياطية</button><button class="btn alt" onclick="restoreM()">📥 استعادة</button></div><div class="cnt" style="margin-top:14px">وضع العرض: ${DM==='browser'?'متصفح (عادي)':'تطبيق مثبَّت ('+DM+')'}</div></main>`}
async function saveCfg(){const v={};for(const k of Object.keys(DEF))v[k]=$('#c_'+k).value;await setCfg(v);toast('تم الحفظ');home()}

// ===== بون التسليم =====
let S,PR=[],CU=[];
async function sale(){
 PR=await P.all();CU=await rq(db.transaction('customers').objectStore('customers').getAll());S={lines:[]};
 $('#app').innerHTML=head('بون التسليم',1)+`<main>
 <label>بيانات الزبون — إجبارية *</label><div class="two"><input id="sn" list="dn" placeholder="اسم الزبون *" oninput="cn()"><input id="sp" list="dp" inputmode="tel" placeholder="هاتف الزبون *" oninput="cn(1)"></div>
 <datalist id="dn">${CU.map(c=>`<option value="${e(c.name)}">`).join('')}</datalist><datalist id="dp">${CU.map(c=>`<option value="0${c.phone}">${e(c.name)}</option>`).join('')}</datalist>
 <div class="bar"><input id="sq" placeholder="ابحث عن منتج…" oninput="sr()" style="margin:0"><button class="btn new" style="flex:0 0 135px" onclick="ext()">＋ منتج جديد</button></div>
 <div id="sr"></div><div id="ls"></div><div id="tt" class="tt"></div>
 <label>المدفوع</label><div class="bar"><input id="pd" inputmode="decimal" oninput="tot()" style="margin:0"><button class="btn full" style="flex:0 0 90px" onclick="$('#pd').value=tl()/100;tot()">كامل</button></div>
 <div class="bar"><button class="btn" onclick="save(0)">💾 حفظ</button><button class="btn wa" onclick="save(1)">حفظ + واتساب</button></div></main>`;rl()}
function cn(p){setTimeout(chkC);$('#sn').classList.remove('bad');$('#sp').classList.remove('bad');const t=ph($('#sp').value),c=p?CU.find(x=>x.phone===t):CU.find(x=>x.name===$('#sn').value);
 if(c){if(p)$('#sn').value=c.name;else $('#sp').value='0'+c.phone}}
function sr(){const raw=$('#sq').value.trim(),k=raw.toLowerCase().replace(/\s+/g,' ');
 const L=k?PR.filter(x=>x.k.includes(k)).sort((a,b)=>b.k.startsWith(k)-a.k.startsWith(k)).slice(0,6):[];
 $('#sr').innerHTML=L.map(x=>`<div class="row sg" onclick="add(${x.id})"><b>${e(x.n)}</b><span>${M(x.s)}</span><span></span></div>`).join('')+(k&&!PR.some(x=>x.k===k)?`<div class="nw" onclick="ext()">＋ منتج جديد: ${e(raw)}</div>`:'')}
function add(id){const x=PR.find(y=>y.id===id);S.lines.push({n:x.n,p:x.s/100,q:1});$('#sq').value='';sr();rl()}
function ext(){const n=$('#sq').value.trim().replace(/\s+/g,' ');if(!n)return toast('اكتب اسم المنتج في خانة البحث');
 const x=PR.find(y=>y.k===n.toLowerCase());if(x)return add(x.id);
 S.lines.push({n,p:'',q:1});$('#sq').value='';sr();rl();const a=$('#ls').querySelectorAll('.ln');a[a.length-1].querySelector('input').focus()}
function ed(i,k,v,el){S.lines[i][k]=v;el.classList.toggle('need',k==='p'?C(v)<=0:!(parseFloat(String(v).replace(',','.'))>0));tot()}
function chkC(){const on=S.lines.length>0;$('#sn').classList.toggle('need',on&&!$('#sn').value.trim());$('#sp').classList.toggle('need',on&&!ph($('#sp').value))}
function del(i){S.lines.splice(i,1);rl()}
const tl=()=>S.lines.reduce((s,l)=>s+Math.round(C(l.p)*(parseFloat(l.q)||0)),0);
function tot(){const t=tl(),p=Math.max(0,Math.min(C($('#pd').value),t));$('#tt').innerHTML=`<span>المجموع: ${M(t)}</span><span>المتبقي: ${M(t-p)}</span>`}
function rl(){$('#ls').innerHTML=S.lines.map((l,i)=>`<div class="ln"><b>${i+1}- ${e(l.n)}</b><input inputmode="decimal" placeholder="السعر" value="${e(l.p)}" class="${C(l.p)>0?'':'need'}" oninput="ed(${i},'p',this.value,this)"><input class="q${parseFloat(l.q)>0?'':' need'}" inputmode="decimal" value="${e(l.q)}" oninput="ed(${i},'q',this.value,this)"><button onclick="del(${i})">✕</button></div>`).join('');tot();chkC()}
async function save(w){try{
 const nm=$('#sn'),tp=$('#sp');nm.classList.remove('bad');tp.classList.remove('bad');
 if(!nm.value.trim()){nm.classList.add('bad');nm.focus();return toast('اسم الزبون إجباري')}
 if(!ph(tp.value)){tp.classList.add('bad');tp.focus();return toast('هاتف الزبون إجباري (8 أرقام على الأقل)')}
 if(!S.lines.length)return toast('أضف منتجاً واحداً على الأقل');
 const bi=S.lines.findIndex(l=>C(l.p)<=0);if(bi>=0){document.querySelectorAll('#ls .ln')[bi].querySelector('input').focus();return toast('أدخل سعر كل منتج')}
 const b=await E.sale({name:$('#sn').value,phone:$('#sp').value,lines:S.lines,paid:$('#pd').value});
 b.name=$('#sn').value.trim();toast('تم الحفظ — '+b.id);
 if(w)openWa(await waUrl(b));
 sale()}catch(x){toast(x.message)}}
const fill=(t,v)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
function bonText(c,b){const d=new Date(b.ts),mo=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'],z=n=>String(n).padStart(2,'0');
 return fill(c.tpl,{magasin:c.shop,n:b.id,date:d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear(),heure:z(d.getHours())+':'+z(d.getMinutes()),client:b.name,
 lignes:b.lines.map((l,i)=>fill(c.lnf,{i:i+1,produit:l.n,q:l.q,p:M(l.p),t:M(l.t)})).join('\n'),articles:b.lines.reduce((s,l)=>s+l.q,0),total:M(b.total),paye:M(b.paid),reste:M(b.rest),tel:c.tel,adr:c.adr,merci:c.thx,cur:c.cur})}
async function waUrl(b){const c=await cfg();return 'https://wa.me/'+c.cc+b.phone+'?text='+encodeURIComponent(bonText(c,b))}

// ===== الزبناء =====
let G;
function openWa(u){let w=null;try{w=window.open(u,'_blank')}catch(_){}if(!w)location.href=u}
async function customers(q=''){
 const [cu,bs]=await Promise.all([rq(db.transaction('customers').objectStore('customers').getAll()),rq(db.transaction('bons').objectStore('bons').getAll())]);
 const d={};bs.forEach(b=>d[b.phone]=(d[b.phone]||0)+b.rest);
 const k=q.trim().toLowerCase(),dg=k.replace(/\D/g,'').replace(/^0/,'');
 const L=cu.filter(c=>!k||c.name.toLowerCase().includes(k)||(dg&&c.phone.includes(dg))).sort((a,b)=>(d[b.phone]||0)-(d[a.phone]||0)||a.name.localeCompare(b.name));
 const T=Object.values(d).reduce((s,x)=>s+x,0);
 $('#app').innerHTML=head('الزبناء',1)+`<main><div class="tt"><span>إجمالي الديون</span><span>${M(T)}</span></div>
 <div class="bar"><button class="btn" onclick="oldM()">➕ إضافة دين قديم</button></div><input id="q" placeholder="ابحث بالاسم أو الهاتف…" value="${e(q)}" oninput="customers(this.value)">
 ${L.map(c=>`<div class="row" style="grid-template-columns:1fr 90px" onclick="cust('${c.phone}')"><b>${e(c.name)} <small class="hd">0${c.phone}</small></b><span style="${d[c.phone]?'':'color:var(--mut)'}">${M(d[c.phone]||0)}</span></div>`).join('')||'<div class="cnt">لا يوجد زبناء بعد</div>'}</main>`;
 if(q){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}}
async function cust(p){
 const [c,cf,bs]=await Promise.all([rq(db.transaction('customers').objectStore('customers').get(p)),cfg(),rq(db.transaction('bons').objectStore('bons').index('phone').getAll(p))]);
 bs.sort((a,b)=>b.ts-a.ts);const d=bs.reduce((s,b)=>s+b.rest,0);G={c,cf,bs,d};
 $('#app').innerHTML=`<header><button class="back" onclick="customers()">رجوع</button><h1>${e(c.name)} <small class="hd">0${p}</small></h1><span class="logo">Foad</span></header><main>
 <div class="tt"><span>الدين</span><span>${M(d)} ${e(cf.cur)}</span></div>
 <div class="bar"><button class="btn" onclick="payM()">💰 دفعة</button><button class="btn alt" onclick="retM()">↩ إرجاع</button><button class="btn alt" onclick="remind()">📲 تذكير</button></div><div class="bar"><button class="btn alt" onclick="oldM('${p}')">➕ إضافة دين قديم</button></div>
 <div class="row hd"><b>البون</b><span>المجموع</span><span>المتبقي</span></div>
 ${bs.map((b,i)=>`<div class="row" onclick="bonM(${i})"><b>${b.id}<br><small class="hd">${new Date(b.ts).toLocaleDateString('fr-FR')}</small></b><span>${M(b.total)}</span><span style="${b.rest?'':'color:var(--mut)'}">${M(b.rest)}</span></div>`).join('')}</main>`}
function payM(){if(!G.d)return toast('لا دين على هذا الزبون');
 modal(`<h3>دفعة — الدين ${M(G.d)}</h3><input id="am" inputmode="decimal" placeholder="المبلغ"><div class="bar"><button class="btn alt" onclick="$('#am').value=G.d/100">كامل</button><button class="btn" onclick="doPay()">تأكيد</button></div>`);$('#am').focus()}
async function doPay(){try{await E.pay(G.c.phone,$('#am').value);modal('');toast('تم تسجيل الدفعة');cust(G.c.phone)}catch(x){toast(x.message)}}
function retM(){modal(`<h3>إرجاع بضاعة</h3><label>قيمة البضاعة المرجعة</label><input id="am" inputmode="decimal"><div class="bar"><button class="btn" onclick="doRet()">تأكيد</button></div>`);$('#am').focus()}
async function doRet(){try{const r=await E.ret(G.c.phone,$('#am').value);cust(G.c.phone);
 if(r.refund)modal(`<h3>يُرد للزبون ${M(r.refund)} ${e(G.cf.cur)}</h3><div class="cnt">خُصم ${M(r.debt)} من الدين</div><button class="btn" style="width:100%" onclick="modal('')">حسناً</button>`);
 else{modal('');toast('خُصم '+M(r.debt)+' من الدين')}}catch(x){toast(x.message)}}
function bonM(i){const b=G.bs[i];
 modal(`<h3>${b.id}</h3>${b.lines.map((l,j)=>`<div class="cnt">${j+1}. ${e(l.n)} ${l.q}×${M(l.p)} = ${M(l.t)}</div>`).join('')}<div class="cnt">المجموع ${M(b.total)} — المتبقي ${M(b.rest)}</div><div class="bar"><button class="btn" onclick="resend(${i})">إرسال واتساب</button><button class="btn alt" onclick="modal('')">إغلاق</button></div>`)}
async function resend(i){const b={...G.bs[i],name:G.c.name};b.paid=b.total-b.rest;modal('');openWa(await waUrl(b))}
function remind(){if(!G.d)return toast('لا دين على هذا الزبون');const c=G.cf;
 const t=c.rem.replace(/\{client\}/g,G.c.name).replace(/\{reste\}/g,M(G.d)).replace(/\{cur\}/g,c.cur).replace(/\{magasin\}/g,c.shop).replace(/\{tel\}/g,c.tel);
 openWa(`https://wa.me/${c.cc}${G.c.phone}?text=${encodeURIComponent(t)}`)}

// ===== النسخ الاحتياطي =====
const STS=['products','customers','bons','ops','meta'];
async function backup(){const o={v:1,t:Date.now()};for(const s of STS)o[s]=await rq(db.transaction(s).objectStore(s).getAll());
 const f=new File([JSON.stringify(o)],'foad-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 await tx(['meta'],t=>rq(t.objectStore('meta').put({k:'lastBackup',v:Date.now()})));
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});toast('تم حفظ النسخة');return home()}}catch(_){}
 const l=document.createElement('a');l.href=URL.createObjectURL(f);l.download=f.name;l.click();toast('تم تصدير النسخة');home()}
function restoreM(){modal(`<h3>استعادة نسخة</h3><div class="cnt">سيتم استبدال كل البيانات الحالية.</div><input type="file" id="rf" accept=".json"><div class="bar"><button class="btn" onclick="doRestore()">استعادة</button><button class="btn alt" onclick="modal('')">إلغاء</button></div>`)}
async function doRestore(){try{const f=$('#rf').files[0];if(!f)return toast('اختر ملفاً');
 let o;try{o=JSON.parse(await f.text())}catch(_){throw new Error('ملف غير صالح')}
 if(!o||o.v!==1||STS.some(s=>!Array.isArray(o[s]))||o.bons.some(b=>!b.id||!b.phone||!(b.rest>=0)||b.rest>b.total))throw new Error('ملف غير صالح');
 await tx(STS,async t=>{for(const s of STS){const st=t.objectStore(s);await rq(st.clear());for(const r of o[s])await rq(st.put(r))}});
 modal('');toast('تمت الاستعادة');home()}catch(x){toast(x.message)}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function oldM(p){const n=p&&G&&G.c&&G.c.phone===p?G.c.name:'';
 modal(`<h3>إضافة دين قديم</h3><div class="two"><input id="on" placeholder="اسم الزبون *" value="${e(n)}"><input id="op" inputmode="tel" placeholder="الهاتف *" value="${p?'0'+p:''}"></div><input id="oa" inputmode="decimal" placeholder="مبلغ الدين *"><label>تاريخ الدين (اختياري)</label><input id="od" type="date"><div class="bar"><button class="btn" onclick="doOld()">حفظ</button><button class="btn alt" onclick="modal('')">إلغاء</button></div>`);(n?$('#oa'):$('#on')).focus()}
async function doOld(){try{const b=await E.oldDebt({name:$('#on').value,phone:$('#op').value,amount:$('#oa').value,date:$('#od').value});modal('');toast('تمت إضافة الدين');cust(b.phone)}catch(x){toast(x.message)}}
function prevBon(){const c={...DEF};for(const k of Object.keys(DEF))c[k]=$('#c_'+k).value;
 const b={id:'61119001',ts:Date.now(),name:'محمد',phone:'612345678',lines:[{n:'Peinture 5L',q:2,p:15000,t:30000},{n:'Marteau',q:1,p:4500,t:4500}],total:34500,paid:10000,rest:24500};
 modal(`<h3>معاينة</h3><pre style="white-space:pre-wrap;font:15px/1.5 system-ui;margin:0">${e(bonText(c,b))}</pre><button class="btn" style="width:100%;margin-top:10px" onclick="modal('')">إغلاق</button>`)}
const DM=['fullscreen','standalone','minimal-ui','browser'].find(m=>matchMedia('(display-mode: '+m+')').matches)||'browser';
if(DM==='browser'&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
openDB().then(home);
</script></body></html>
